// ============ BEFORE / AFTER SLIDER ============
const BeforeAfterSlider = ({ before, after, beforeAlt, afterAlt }) => {
  const containerRef = useRef(null);
  const [position, setPosition] = useState(50);
  const draggingRef = useRef(false);

  const updatePosition = useCallback((clientX) => {
    const el = containerRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const pct = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
    setPosition(pct);
  }, []);

  /* PERF: registramos los listeners de window SOLO mientras se arrastra.
     Antes corrían siempre que el componente estuviera montado y filtraban
     con dragging.current → costo bajo pero acumulable con varias instancias.
     Ahora: mousedown/touchstart attach, mouseup/touchend detach.
     passive:true en touchmove para no bloquear scroll vertical. */
  const stopDrag = useCallback(() => {
    draggingRef.current = false;
    window.removeEventListener("mousemove", onMove);
    window.removeEventListener("touchmove", onMove);
    window.removeEventListener("mouseup", stopDrag);
    window.removeEventListener("touchend", stopDrag);
    window.removeEventListener("touchcancel", stopDrag);
  }, []);

  // onMove definido fuera del effect para que stopDrag pueda removerlo.
  const onMove = useCallback((e) => {
    if (!draggingRef.current) return;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    updatePosition(x);
  }, [updatePosition]);

  const startDrag = useCallback((e) => {
    draggingRef.current = true;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    updatePosition(x);
    window.addEventListener("mousemove", onMove, { passive: true });
    window.addEventListener("touchmove", onMove, { passive: true });
    window.addEventListener("mouseup", stopDrag, { passive: true });
    window.addEventListener("touchend", stopDrag, { passive: true });
    window.addEventListener("touchcancel", stopDrag, { passive: true });
  }, [onMove, stopDrag, updatePosition]);

  // Cleanup defensivo si el componente se desmonta a mitad de drag.
  useEffect(() => stopDrag, [stopDrag]);

  // A11y: keyboard controls — flechas mueven el divider 5% por tick,
  // Home/End saltan a 0/100%. Hace el slider operable sin mouse.
  const onKeyDown = useCallback((e) => {
    switch (e.key) {
      case "ArrowLeft":  setPosition(p => Math.max(0,   p - 5)); e.preventDefault(); break;
      case "ArrowRight": setPosition(p => Math.min(100, p + 5)); e.preventDefault(); break;
      case "Home":       setPosition(0);   e.preventDefault(); break;
      case "End":        setPosition(100); e.preventDefault(); break;
      default: break;
    }
  }, []);

  return (
    <div
      ref={containerRef}
      onMouseDown={startDrag}
      onTouchStart={startDrag}
      onKeyDown={onKeyDown}
      role="slider"
      tabIndex={0}
      aria-label="Before and after comparison slider. Drag horizontally, or use arrow keys, to compare the cleaning result."
      aria-valuemin={0}
      aria-valuemax={100}
      aria-valuenow={Math.round(position)}
      aria-valuetext={`${Math.round(position)}% before, ${Math.round(100 - position)}% after`}
      className="ba-slider relative w-full aspect-[4/3] md:aspect-[16/10] rounded-3xl overflow-hidden cursor-ew-resize select-none"
      /* touchAction: "pan-y" → el browser maneja scroll vertical normalmente,
         pero el drag horizontal queda capturado por nuestro handler. Esto evita
         que el touch del divider B/A propague accidentalmente a algún parent
         con swipe handlers (defensa adicional aunque la carousel parent solo
         navega via arrow clicks). */
      style={{
        border: "1px solid var(--border-med)",
        boxShadow: "0 20px 60px rgba(0,0,0,0.5)",
        touchAction: "pan-y",
      }}
    >
      <img src={after}  alt={afterAlt  || "After cleaning result"}  width="1600" height="1000" loading="lazy" decoding="async" className="absolute inset-0 w-full h-full object-cover" draggable={false} />
      <div className="absolute inset-0 overflow-hidden" style={{ clipPath: `inset(0 ${100 - position}% 0 0)` }}>
        <img src={before} alt={beforeAlt || "Before cleaning"} width="1600" height="1000" loading="lazy" decoding="async" className="absolute inset-0 w-full h-full object-cover" draggable={false} />
      </div>

      <div className="absolute top-4 left-4 z-20">
        <span className="inline-flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-[0.15em] text-white px-3 py-1.5 rounded-full shadow-lg" style={{ background: "rgba(13,79,114,0.75)", border: "1px solid rgba(255,255,255,0.15)", backdropFilter: "blur(8px)" }}>
          <span className="w-1.5 h-1.5 rounded-full bg-red-400" aria-hidden="true" />Before
        </span>
      </div>
      <div className="absolute top-4 right-4 z-20">
        <span className="inline-flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-[0.15em] text-white px-3 py-1.5 rounded-full shadow-lg" style={{ background: "var(--orange)", boxShadow: "0 4px 12px rgba(255,107,31,0.4)" }}>
          <span className="w-1.5 h-1.5 rounded-full bg-white" aria-hidden="true" />After
        </span>
      </div>

      <div className="absolute top-0 bottom-0 z-10 pointer-events-none" style={{ left: `${position}%`, transform: "translateX(-50%)" }}>
        <div className="w-0.5 h-full" style={{ background: "var(--orange)", boxShadow: "0 0 20px rgba(255,107,31,0.7)" }} />
        <div
          className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-14 h-14 rounded-full flex items-center justify-center pointer-events-auto cursor-ew-resize shadow-2xl"
          style={{ background: "rgba(13,79,114,0.85)", border: "2px solid var(--orange)", backdropFilter: "blur(8px)" }}
          aria-hidden="true"
        >
          <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="9 18 3 12 9 6" />
            <polyline points="15 6 21 12 15 18" />
          </svg>
        </div>
      </div>

      <div className="absolute bottom-4 left-1/2 -translate-x-1/2 z-20 pointer-events-none">
        <span className="text-[11px] font-bold uppercase tracking-[0.15em] text-white bg-black/50 backdrop-blur-md px-3 py-1.5 rounded-full">
          Drag to compare
        </span>
      </div>
    </div>
  );
};

// ============ RESULTS SECTION (Tabbed B&A Gallery) ============
//
// Tabs categorías-sync con OurServices: el usuario selecciona el servicio
// y la galería abajo filtra solo los B/A de esa categoría. AnimatePresence
// hace fade-out + fade-in cuando cambia el tab activo.
//
// Estructura de datos:
//   tabs[]   — definición de las 6 categorías (id + label)
//   cases[]  — array plano de B/A pairs con `tabId` que matchea el tab.
//              Cada categoría puede tener N cases (acá es 1 cada una como
//              placeholder, fácil de extender).
//
// Para SWAP de placeholder a real assets: cada `case` tiene `before` + `after`
// que apuntan a /images/. Reemplazá esas rutas con los assets nuevos cuando
// lleguen las fotos del cliente para cada categoría.
const ResultsSection = () => {
  const tabs = [
    { id: "roof-softwash",     label: "Roof Softwash" },
    { id: "pressure-cleaning", label: "Pressure Cleaning" },
    { id: "exterior-window",   label: "Exterior Window Cleaning" },
    { id: "solar-panels",      label: "Solar Panel Cleaning" },
    { id: "paver-sealing",     label: "Paver/Concrete Sealing" },
    { id: "gutter-cleaning",   label: "Gutter Clean Out" },
  ];

  /* PLACEHOLDERS — cada categoría tiene N cases (slides del carousel interno).
     Cada tab arranca con 2+ slides usando los assets locales disponibles para
     demostrar la navegación. Cuando lleguen fotos reales del cliente para
     una categoría, reemplazar las rutas before/after de esos cases.

     SCALABILITY NOTE:
     El carousel YA es escalable sin tocar JS. La estructura React monta UN
     solo carousel a la vez (el del tab activo), y `filteredCases` se calcula
     dinámicamente con `cases.filter(c => c.tabId === activeTabId)`. Las
     arrows, el counter y el slideIndex viven en ResultsSection y se resetean
     en cada cambio de tab via useEffect. NO hace falta `.forEach()` sobre
     varias instancias porque solo existe una a la vez.

     Para añadir más slides a cualquier tab: agregar un objeto más con el
     mismo `tabId`. El carousel detecta `totalSlides > 1` y muestra arrows +
     counter automáticamente. */
  const cases = [
    /* ---------- Roof Softwash (3 slides — fotos reales del cliente) ----------
       Assets en ./images/before and after roof/ con nombres conservados tal
       cual los subió el cliente (incluye el typo "roof despues3.jpeg" sin
       espacio antes del 3). El browser URL-encodea los espacios al fetch. */
    { tabId: "roof-softwash",     title: "Tile roof restoration",          subtitle: "Miami-Dade, FL", before: `${IMG}/before and after roof/roof antes 1.jpeg`, after: `${IMG}/before and after roof/roof despues 1.jpeg` },
    { tabId: "roof-softwash",     title: "Deep cleaning for algae & stains", subtitle: "Miami-Dade, FL", before: `${IMG}/before and after roof/roof antes 2.jpeg`, after: `${IMG}/before and after roof/roof despues 2.jpeg` },
    { tabId: "roof-softwash",     title: "Complete roof revival",          subtitle: "Miami-Dade, FL", before: `${IMG}/before and after roof/roof antes 3.jpeg`, after: `${IMG}/before and after roof/roof despues3.jpeg` },

    /* ---------- Pressure Cleaning (3 slides — fotos reales del cliente) ----------
       Assets en ./images/Pressure cleaning/ (la P es mayúscula, conservada
       tal cual la subió el cliente). El browser URL-encodea los espacios. */
    { tabId: "pressure-cleaning", title: "Driveway deep pressure cleaning", subtitle: "Before / After", before: `${IMG}/Pressure cleaning/pressure antes 1.jpeg`, after: `${IMG}/Pressure cleaning/pressure despues 1.jpeg` },
    { tabId: "pressure-cleaning", title: "Concrete patio restoration",      subtitle: "Before / After", before: `${IMG}/Pressure cleaning/pressure antes 2.jpeg`, after: `${IMG}/Pressure cleaning/pressure despues 2.jpeg` },
    { tabId: "pressure-cleaning", title: "Walkway dirt & grime removal",    subtitle: "Before / After", before: `${IMG}/Pressure cleaning/pressure antes 3.jpeg`, after: `${IMG}/Pressure cleaning/pressure despues 3.jpeg` },

    /* ---------- Exterior Window Cleaning (3 slides — fotos reales del cliente) ----------
       Assets en ./images/exterior window cleaning/. Slides 1 + 4 (antes/despues 1)
       tienen un espacio antes de .jpeg en disk — se conservan tal cual los
       subió el cliente. El browser URL-encodea los espacios al fetch.
       Cada case lleva un `alt` específico (SEO-friendly, sin keyword stuffing)
       que el carousel usa en ambas imágenes via el patrón "${alt} — before/after". */
    { tabId: "exterior-window",   title: "Exterior window cleaning before and after streak-free wash", subtitle: "Before / After", alt: "Exterior window cleaning before and after streak-free wash", before: `${IMG}/exterior window cleaning/exterior antes 1 .jpeg`, after: `${IMG}/exterior window cleaning/exterior despues 1 .jpeg` },
    { tabId: "exterior-window",   title: "Hard water stain removal on exterior home windows",         subtitle: "Before / After", alt: "Hard water stain removal on exterior home windows",         before: `${IMG}/exterior window cleaning/exterior antes 2.jpeg`,  after: `${IMG}/exterior window cleaning/exterior despues 2.jpeg` },
    { tabId: "exterior-window",   title: "Second-story exterior glass restoration before and after",  subtitle: "Before / After", alt: "Second-story exterior glass restoration before and after",  before: `${IMG}/exterior window cleaning/exterior antes 3.jpeg`,  after: `${IMG}/exterior window cleaning/exterior despues 3.jpeg` },

    /* ---------- Solar Panel Cleaning (2 slides) ---------- */
    { tabId: "solar-panels",      title: "Roof-mounted panels",        subtitle: "Pinecrest, FL",     before: `${IMG}/roof-tile-before.jpg`,           after: `${IMG}/roof-tile-after.jpg` },
    { tabId: "solar-panels",      title: "Solar array refresh",        subtitle: "Palmetto Bay, FL",  before: `${IMG}/solar-panel-cleaning.jpeg`,      after: `${IMG}/roof-tile-after.jpg` },

    /* ---------- Paver/Concrete Sealing (3 slides — fotos reales del cliente) ----------
       Assets en ./images/paver/. Los nombres con un espacio antes de .jpeg
       (ej. "paver antes 1 .jpeg") se conservan tal cual el cliente los subió
       — el browser URL-encodea los espacios al hacer fetch. Slide 2's "after"
       es el único sin space (paver despues 2.jpeg). */
    { tabId: "paver-sealing",     title: "Paver driveway sealing",          subtitle: "Before / After", before: `${IMG}/paver/paver antes 1 .jpeg`, after: `${IMG}/paver/paver despues 1 .jpeg` },
    { tabId: "paver-sealing",     title: "Pool deck paver restoration",     subtitle: "Before / After", before: `${IMG}/paver/paver antes 2 .jpeg`, after: `${IMG}/paver/paver despues 2.jpeg` },
    { tabId: "paver-sealing",     title: "Backyard patio weed removal & seal", subtitle: "Before / After", before: `${IMG}/paver/paver antes 3 .jpeg`, after: `${IMG}/paver/paver despues 3 .jpeg` },

    /* ---------- Gutter Clean Out (2 slides) ---------- */
    { tabId: "gutter-cleaning",   title: "Cedar fence reset",          subtitle: "Coconut Grove, FL", before: `${IMG}/fence-before.jpg`,               after: `${IMG}/fence-after.jpg` },
    { tabId: "gutter-cleaning",   title: "Gutter line clear-out",      subtitle: "South Miami, FL",   before: `${IMG}/gutter-clean-out.jpg`,           after: `${IMG}/fence-after.jpg` },
  ];

  const [activeTabId, setActiveTabId] = useState(tabs[0].id);
  const filteredCases = cases.filter((c) => c.tabId === activeTabId);

  /* CAROUSEL STATE: índice del slide actual dentro del tab activo.
     Se resetea a 0 cada vez que cambia el tab (vía useEffect con activeTabId). */
  const [slideIndex, setSlideIndex] = useState(0);
  useEffect(() => { setSlideIndex(0); }, [activeTabId]);

  const totalSlides = filteredCases.length;
  const goToSlide = (idx) => setSlideIndex(Math.max(0, Math.min(totalSlides - 1, idx)));
  const nextSlide = () => goToSlide(slideIndex + 1);
  const prevSlide = () => goToSlide(slideIndex - 1);

  return (
    <section id="results" className="py-16 md:py-24" style={{ background: "var(--brand-dark-blue)" }}>
      <div className="max-w-[1280px] mx-auto px-4 sm:px-6 md:px-10 lg:px-16">

        {/* Pill heading standardized */}
        <div style={{ textAlign: "center", marginBottom: "1.25rem" }}>
          <h2 className="section-pill-heading">
            See the <span className="text-brand-pink">Transformation</span>
          </h2>
        </div>
        <p
          className="text-base md:text-lg text-center max-w-2xl mx-auto leading-relaxed font-medium mb-8 md:mb-10"
          style={{ color: "#FFFFFF" }}
        >
          Real Miami homes. Pick a service to filter the gallery, then drag any slider to compare before and after.
        </p>

        {/* Filter tabs — scrollable horizontal en mobile, centered/wrapped en desktop */}
        <div className="filter-tabs-scroller" role="tablist" aria-label="Filter B&A gallery by service">
          {tabs.map((t) => (
            <button
              key={t.id}
              type="button"
              role="tab"
              aria-selected={activeTabId === t.id}
              data-active={activeTabId === t.id}
              onClick={() => setActiveTabId(t.id)}
              className="filter-tab-pill"
            >
              {t.label}
            </button>
          ))}
        </div>

        {/*
          Filtered B&A nested carousel. Layer architecture:
            <motion.div key={activeTabId}> ← keyed remount + fade-in al cambiar tab
              <ba-carousel-wrap>      ← contiene viewport + arrows
                <ba-carousel-viewport>← overflow:hidden
                  <ba-carousel-track> ← translateX(-slideIndex*100%)
                    <ba-carousel-slide> × N ← uno por case
                      <ba-card>            ← double border wrapper
                        <BeforeAfterSlider> ← drag horizontal capturado aquí

          ✱ NO CONFLICT entre arrows del carousel y drag del slider B/A:
            - El carousel SOLO navega via arrow click handlers (onClick).
            - El slider B/A captura mouse/touch en su propio container.
            - touchAction:"pan-y" en el slider deja el scroll vertical libre
              y aísla el drag horizontal en el slider.
            - No hay swipe handlers en el carousel parent → cero overlap.

          NOTE: Inicialmente usaba <AnimatePresence mode="wait"> + motion.div
          para fade entre tabs, pero el motion.div quedaba atorado en
          opacity:0 (initial style) sin disparar el animate. Para evitar
          esa flakiness y garantizar que el carousel siempre sea visible,
          se usa un plain div con CSS transition + key remount: el remount
          via key={activeTabId} dispara la animación CSS keyframe definida
          en .ba-tab-fade-in cada vez que cambia el tab.
        */}
        <div key={activeTabId} className="ba-tab-fade-in">
            {totalSlides === 0 ? (
              <p className="text-center py-12 opacity-70" style={{ color: "#FFFFFF" }}>
                No projects yet for this category. Check back soon.
              </p>
            ) : (
              <div className="ba-carousel-wrap max-w-[1000px] mx-auto">

                {/* Viewport con overflow:hidden — solo el slide activo es visible */}
                <div className="ba-carousel-viewport">
                  <div
                    className="ba-carousel-track"
                    style={{ transform: `translateX(-${slideIndex * 100}%)` }}
                  >
                    {filteredCases.map((c, i) => (
                      <div
                        key={c.tabId + "-" + i}
                        className="ba-carousel-slide"
                        aria-hidden={i !== slideIndex}
                      >
                        {/* Card minimalista: solo el slider B/A.
                            El text box inferior (subtitle + title) fue
                            removido por pedido del cliente para un look
                            más limpio. Los campos `title` / `subtitle`
                            siguen en cases[] como metadata y se usan
                            para generar el alt text de las imágenes. */}
                        <article className="ba-card flex flex-col">
                          {/* Alt-text source: si el case tiene un campo `alt`
                              específico (más descriptivo / SEO-targeted) lo
                              usamos; si no, caemos al patrón title-based para
                              backward-compat con los demás tabs. */}
                          <BeforeAfterSlider
                            before={c.before}
                            after={c.after}
                            beforeAlt={`${c.alt || c.title} — before`}
                            afterAlt={`${c.alt || c.title} — after`}
                          />
                        </article>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Arrows: solo se muestran si hay más de 1 slide en este tab */}
                {totalSlides > 1 && (
                  <>
                    <button
                      type="button"
                      onClick={prevSlide}
                      disabled={slideIndex === 0}
                      className="ba-carousel-arrow ba-carousel-arrow--prev"
                      aria-label="Previous slide"
                    >
                      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M15 18l-6-6 6-6" />
                      </svg>
                    </button>
                    <button
                      type="button"
                      onClick={nextSlide}
                      disabled={slideIndex === totalSlides - 1}
                      className="ba-carousel-arrow ba-carousel-arrow--next"
                      aria-label="Next slide"
                    >
                      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M9 6l6 6-6 6" />
                      </svg>
                    </button>
                  </>
                )}

                {/* Slide counter — sutil, solo si hay 2+ slides */}
                {totalSlides > 1 && (
                  <div className="text-center">
                    <span className="ba-carousel-counter" aria-live="polite">
                      <strong>{slideIndex + 1}</strong>
                      <span style={{ opacity: 0.5 }}>/</span>
                      <span>{totalSlides}</span>
                    </span>
                  </div>
                )}

              </div>
            )}
        </div>

        {/* Bottom CTAs — sistema global de color coding (orange call / pink quote) */}
        <div className="flex flex-col sm:flex-row items-center justify-center gap-3 mt-10 md:mt-12">
          <SecondaryCTA href={PHONE_TEL}>Call about results</SecondaryCTA>
          <PrimaryCTA href={QUOTE_HASH} icon="→">Quote my home</PrimaryCTA>
        </div>
      </div>
    </section>
  );
};

        {/* +/- icon — barras pink visible sobre bg blanco */}

        </div>

  );
};

// ============ APP ============
function App() {

    return () => mm.revert();

  // pb-28 (112px) en mobile reserva espacio para la MobileStickyBottom

  // En lg: la barra sticky desaparece y no necesitamos padding extra.
  return (
    <div className="min-h-screen pb-28 lg:pb-0">
      <StyleInjector />
      <Navbar />
      {/* <main>: landmark semántico que envuelve el contenido principal
          de la página (entre <header> de la Navbar y <footer> del Footer).

          via "skip to content" y Google identifica este bloque como el
          contenido primario del documento. */}
      <main>
        <Hero />
        <TrustStrip />
        <TrustGuarantee />
        <RecentProjectsReviews />
        <ProcessSection />
        <OurServices />

          headline="Don't wait. Get your free estimate today."

          topColor="var(--brand-pink)"

      <MobileStickyBottom />
    </div>
  );
}
