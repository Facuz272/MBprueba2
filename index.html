  <!-- Preconnect for font + script CDNs — reduces render-blocking latency.

       requests fired at runtime. -->

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

  <!-- Babel-standalone + the ESM import map were removed.
       The JSX is now pre-compiled at build time by Vite:
         npm install        (once)
         npm run build      (writes dist/)
         npm run dev        (local dev server with HMR)
       Vite injects the hashed bundle below into <script type="module">
       in dist/index.html. During dev the same tag resolves to src/main.jsx
       directly with HMR. Either way: zero browser-side JSX compilation,
       Babel-standalone (~3 MB) gone, main-thread block gone. -->

  <style>
    html, body { background: #0D4F72; margin: 0; padding: 0; overflow-x: hidden; }
    /* Texto base 16px ya viene del browser default — previene auto-zoom
       de iOS al tappear inputs (cualquier <input> < 16px dispara el zoom). */
    body { font-size: 16px; }
    #loading-fallback {
      position: fixed; inset: 0; background: #0D4F72; color: #aad;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif; font-size: 11px;
      letter-spacing: 0.3em; text-transform: uppercase; z-index: 1;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="loading-fallback">Loading…</div>

  <!-- Vite entry point. In dev, this loads src/main.jsx with HMR.
       In prod, Vite rewrites this to point at the hashed bundle in dist/. -->
  <script type="module" src="/src/main.jsx"></script>

  <!-- Old runtime-Babel block deleted — JSX now lives in src/App.jsx. -->

</body>
